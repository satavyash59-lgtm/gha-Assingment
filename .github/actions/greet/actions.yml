name: 'Greet Action'
description: 'Generates a greeting message'

inputs:
  name:
    description: 'Name to greet'
    required: true
  env_name:
    description: 'Environment name'
    required: false
    default: 'dev'

outputs:
  greeting:
    description: 'Greeting output message'
    value: ${{ steps.step2.outputs.greeting }}

runs:
  using: 'composite'
  steps:
    - name: Run first step
      shell: bash
      run: |
        echo "Starting greeting process for ${{ inputs.name }}..."

    - name: Run second step and set output
      id: step2
      shell: bash
      run: |
        echo "greeting=Hello ${{ inputs.name }}, welcome to ${{ inputs.env_name }}." >> "$GITHUB_OUTPUT"
