name: q1

on:
  workflow_dispatch:
    input:
     version:
       description: 'Version'
       required: true
       type: string
       default: '1.0.0'
       
     release_type:
       description: "Release type"
       required: ture
       type: choice
       options:
         - patch
        - minor
         - major
       default: 'patch'


jobs:
 prepare:
   runs-on: ubuntu-latest
   output:
    build_tag: ${{steps.compute.outputs.build_tag}}
    build_date: ${{steps.compute.outputs.build_tag}}
   steps:
      - name: Compute Outputs
        id: compute
        run: |
          BUILD_TAG="v${{ inputs.version }}-${{ inputs.release_type }}-${{ github.run_number }}"
          BUILD_DATE="$(date +'%Y-%m-%d')"
          
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT" 

 announce:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Print Outputs
        run: |
          echo "Build Tag: ${{ needs.prepare.outputs.build_tag }}"
          echo "Build Date: ${{ needs.prepare.outputs.build_date }}"

      - name: Write Summary Table
        run: |
          {
            echo "## Release Summary"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **Version** | ${{ inputs.version }} |"
            echo "| **Release Type** | ${{ inputs.release_type }} |"
            echo "| **Build Tag** | ${{ needs.prepare.outputs.build_tag }} |"
            echo "| **Build Date** | ${{ needs.prepare.outputs.build_date }} |"
          } >> "$GITHUB_STEP_SUMMARY"

   
