name: Q1 Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        type: string
        required: true
        default: '1.0.0'
      release_type:
        description: "type of version"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
        

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.tag.outputs.build_tag }}
      build_date: ${{ steps.tag.outputs.build_date }}
    steps:
      - id: tag
        name: Compute build tag
      
        run: |
          TAG:"v${{input.version}}-${{input.relese_type}}-${{github.run_numbers}}"
          echo "build_tag=$TAG" >> "GITHUB_OUTPUT"

        id: date
        name: compute build date
        run: echo "build date=$(date +%F)">>"$GITHUB_OUTPUT"
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Output Release Summary
        run: |
          echo "Build Tag: ${{ needs.prepare.outputs.build_tag }}"
          echo "Build Date: ${{ needs.prepare.outputs.build_date }}"

      - name: write summary
        run: |
          {

             echo "| feild | value |"
             echo "| feild  | value |"
             echo | version | ${{inputs.version}} |"

             echo "| Release Type | ${{inputs.release_type}} |"
             echo"Build Tag | ${{needs.prepare.outputs.build_tag}}"
             echo"Build Date | ${{needs.prepare.outputs.build_date}}"

          
          } >>"$GITHUB_OUTPUT"
