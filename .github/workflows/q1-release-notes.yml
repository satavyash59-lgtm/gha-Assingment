name: Q1 Release Notes

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        default: '1.0.0'
      release_type:
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.out.outputs.build_tag }}
      build_date: ${{ steps.out.outputs.build_date }}
    steps:
      - id: out
        run: |
          echo "build_tag=v${{ inputs.version }}-${{ inputs.release_type }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

  announce:
        runs-on: ubuntu-latest
        needs: prepare
        steps:
          - run: |
              echo "Build Tag: ${{ needs.prepare.outputs.build_tag }}"
              echo "Build Date: ${{ needs.prepare.outputs.build_date }}"
